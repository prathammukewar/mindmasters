<title>MindMasters Academy: Math & Chess Training</title>
<style>
:root{
  --bg:#12141a; --bg2:#171a21; --card:#1b1f27; --card2:#222731;
  --ink:#e9e6dd; --muted:#8b93a3; --line:#2c323d;
  --gold:#d9a441; --green:#7fb08a; --red:#c96f6f; --blue:#7d9bc4;
  --purple:#9299c9; --pink:#bd8ba4; --orange:#c98a5e; --teal:#7dae9f;
  --radius:12px;
  --display:'Space Grotesk',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{overscroll-behavior-y:contain;}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none;}
html,body{height:100%;}
body{
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink); min-height:100%; overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;}
input{font-family:inherit;}
.hidden{display:none !important;}

/* ---------- accessibility ---------- */
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.btn.gold:focus-visible,.diffchip.sel:focus-visible,.rolebtn.sel:focus-visible{outline-color:var(--ink);}
#screen-root:focus{outline:none;}
.sq:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--blue);z-index:3;}
.choice.correct::after{content:" \2713";font-weight:900;color:var(--green);}
.choice.wrong::after{content:" \2717";font-weight:900;color:var(--red);}
.btn.small,.diffchip{min-height:38px;}
body.bigtext #app,body.bigtext #toasts,body.bigtext .mmodal{zoom:1.15;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}
}
body.calm *,body.calm *::before,body.calm *::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}

/* ---------- layout ---------- */
#app{max-width:920px;margin:0 auto;padding:16px 16px 90px;}
.screen{animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- top bar ---------- */
#topbar{
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  padding:10px 14px;margin-bottom:14px;background:rgba(30,35,71,.85);
  border:1px solid var(--line);border-radius:var(--radius);
  position:sticky;top:8px;z-index:50;backdrop-filter:blur(8px);
}
#topbar .brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.4px;}
#topbar .brand .logo{width:24px;height:24px;display:flex;}
.statchips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  display:flex;align-items:center;gap:5px;background:var(--card2);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;
  font-size:13px;font-weight:700;white-space:nowrap;
}
.chip .ico{font-size:15px;}
.chip.xp{color:var(--muted);} .chip.streak{color:var(--orange);} .chip.lvl{color:var(--teal);} .chip.coins{color:var(--gold);}

/* ---------- generic cards & buttons ---------- */
.card{
  background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:14px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:#39415a;color:var(--ink);
  border-radius:10px;padding:12px 22px;font-size:14.5px;font-weight:600;
  border:1px solid #4a5470;transition:background .12s,border-color .12s;letter-spacing:.2px;
}
.btn:hover{background:#424b68;border-color:#5a6584;}
.btn:active{background:#333a50;}
.btn.ghost{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:var(--ink);}
.btn.small{padding:8px 14px;font-size:13px;border-radius:11px;}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1c1508;font-weight:700;}
.btn.gold:hover{background:#e6b355;border-color:#e6b355;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

h1.title{font-family:var(--display);font-size:24px;font-weight:700;margin-bottom:4px;letter-spacing:.2px;}
p.sub{color:var(--muted);font-size:14px;line-height:1.5;}
.section-label{font-family:var(--display);font-size:11.5px;font-weight:500;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:20px 0 10px;}

/* ---------- welcome ---------- */
.trustline{font-size:12.5px;margin-top:10px;max-width:420px;margin-left:auto;margin-right:auto;}
.trustline a{color:var(--gold);font-weight:700;}
#welcome{text-align:center;padding-top:40px;}
#welcome .biglogo{font-size:64px;margin-bottom:10px;animation:bob 3s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#welcome h1{font-family:var(--display);font-size:32px;font-weight:700;color:var(--ink);letter-spacing:.3px;}
#welcome .programs{display:flex;gap:12px;justify-content:center;margin:22px 0;flex-wrap:wrap;}
#welcome .prog{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 18px;font-size:13px;font-weight:700;color:var(--muted);}
#nameInput{
  width:min(320px,90%);padding:14px 18px;font-size:16px;border-radius:14px;
  border:2px solid var(--line);background:var(--card);color:var(--ink);
  text-align:center;outline:none;margin:8px 0 4px;
}
#nameInput:focus{border-color:var(--purple);}
.avatar-row{display:flex;gap:10px;justify-content:center;margin:14px 0 20px;flex-wrap:wrap;}
.avatar-pick{font-size:30px;background:var(--card2);border:2px solid var(--line);border-radius:14px;width:56px;height:56px;transition:transform .12s;}
.avatar-pick:hover{transform:scale(1.12);}
.avatar-pick.sel{border-color:var(--gold);background:#3a3512;box-shadow:0 0 14px rgba(255,209,102,.4);}

/* ---------- home ---------- */
.hero{display:flex;align-items:center;gap:14px;}
.hero .av{font-size:46px;background:var(--card2);border:1px solid var(--line);border-radius:18px;width:74px;height:74px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hero .meta{flex:1;min-width:0;}
.hero .meta .hello{font-family:var(--display);font-size:20px;font-weight:700;}
.hero .meta .rank{font-size:13px;color:var(--gold);font-weight:700;margin-bottom:7px;}
.xpbar{height:12px;background:var(--bg);border-radius:999px;overflow:hidden;border:1px solid var(--line);}
.xpbar>div{height:100%;background:var(--gold);border-radius:999px;transition:width .6s ease;}
.xpbar-note{font-size:11.5px;color:var(--muted);margin-top:5px;}

.trackgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:640px){.trackgrid{grid-template-columns:1fr;}}
.track{
  position:relative;overflow:hidden;border-radius:var(--radius);border:1px solid var(--line);
  padding:22px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;color:var(--ink);
}
.track:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.4);}
.track.math{background:var(--card);border-left:3px solid var(--blue);}
.track.chess{background:var(--card);border-left:3px solid var(--purple);}
.track .tico{font-size:26px;font-weight:700;color:var(--gold);opacity:.85;}
.track h3{font-size:20px;font-weight:700;margin:8px 0 2px;}
.track .torg{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--gold);}
.track p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45;}
.track .tprog{margin-top:12px;font-size:12px;font-weight:700;color:var(--teal);}
.track .trainrow{margin-top:12px;display:flex;align-items:center;gap:10px;}
.track .trainnote{font-size:11.5px;color:var(--muted);}

.daily{display:flex;align-items:center;gap:14px;background:#221d10;border:1px solid #54471f;}
.daily .dico{font-size:34px;}
.daily h4{font-size:15px;font-weight:700;color:var(--gold);}
.daily p{font-size:12.5px;color:var(--muted);margin-top:2px;}
.daily .btn{margin-left:auto;flex-shrink:0;}

/* ---------- update bar (new version downloaded by the service worker) ---------- */
#updbar{
  position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:200;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  background:var(--card2);border:1px solid var(--gold);border-radius:14px;
  padding:10px 16px;font-size:13px;font-weight:600;max-width:92vw;
  box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fadeUp .3s ease;
}

/* ---------- hover explanations ---------- */
#tipfloat{position:fixed;z-index:400;max-width:260px;background:#0f1117;color:var(--ink);border:1px solid #3a4152;border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.45;font-weight:500;box-shadow:0 10px 26px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .12s;--ax:50%;}
#tipfloat.show{opacity:1;}
#tipfloat::after{content:"";position:absolute;left:var(--ax);top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#3a4152;}
#tipfloat.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#3a4152;}
[data-tip]:not(button):not([role=button]):not(input){cursor:help;}

/* ---------- guided tour ---------- */
.tourov{position:fixed;inset:0;z-index:300;}
.tourspot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(8,10,16,.68);pointer-events:none;transition:left .25s,top .25s,width .25s,height .25s;border:2px solid var(--gold);}
.tourcard{position:fixed;left:50%;transform:translateX(-50%);width:min(340px,92vw);background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:fadeUp .25s ease;}
.tourcard h3{font-family:var(--display);font-size:17px;margin:2px 0 6px;}
.tourcard p{font-size:13.5px;line-height:1.5;}
.tourstep{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);font-weight:700;}
.tourrow{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}

/* ---------- settings list (profile) ---------- */
.setlist{display:flex;flex-direction:column;gap:8px;}
.setrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;}
.setrow .sico{font-size:20px;width:30px;text-align:center;flex-shrink:0;}
.setrow .stext{flex:1;min-width:0;}
.setrow .stitle{font-weight:700;font-size:14px;}
.setrow .ssub{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.4;}
.setrow .btn.small{flex-shrink:0;}
.setrow.danger{border-color:#4a2a2a;}
.setrow.danger .stitle{color:var(--red);}

/* ---------- keyboard hint on the quiz (pointer devices only) ---------- */
.keyhint{display:none;text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px;}
@media (hover:hover) and (pointer:fine){.keyhint{display:block;}}

/* ---------- topic list ---------- */
.backrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.topiclist{display:grid;gap:11px;}
.topic{
  display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:15px 17px;
  cursor:pointer;transition:transform .12s,border-color .12s;text-align:left;color:var(--ink);width:100%;
}
.topic:hover{transform:translateX(4px);border-color:var(--purple);}
.topic .tpico{font-size:30px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:13px;flex-shrink:0;}
.topic .tpmeta{flex:1;min-width:0;}
.topic h4{font-size:15.5px;font-weight:800;}
.topic .tpsub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.topic .tpbar{height:7px;background:var(--bg);border-radius:99px;margin-top:8px;overflow:hidden;}
.topic .tpbar>div{height:100%;border-radius:99px;background:var(--green);transition:width .4s;}
.topic .tpstat{font-size:12px;font-weight:800;color:var(--muted);flex-shrink:0;text-align:right;}
.topic .tpstat .done{color:var(--green);}
.pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;letter-spacing:.5px;}
.pill.d1{background:#14532d;color:#86efac;} .pill.d2{background:#1e3a8a;color:#93c5fd;}
.pill.d3{background:#581c87;color:#d8b4fe;} .pill.d4{background:#7f1d1d;color:#fca5a5;}

/* ---------- quiz ---------- */
.quizhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.qprogress{flex:1;height:10px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line);}
.qprogress>div{height:100%;background:var(--purple);transition:width .35s;}
.qcount{font-size:12.5px;font-weight:800;color:var(--muted);white-space:nowrap;}
.combo{font-size:12.5px;font-weight:700;color:var(--orange);white-space:nowrap;}
.question-card{min-height:120px;}
.qtext{font-size:17.5px;line-height:1.55;font-weight:600;}
.qtext .frac{white-space:nowrap;}
.choices{display:grid;gap:10px;margin-top:18px;}
@media(min-width:560px){.choices.four{grid-template-columns:1fr 1fr;}}
.choice{
  background:var(--card2);border:2px solid var(--line);border-radius:13px;
  padding:13px 16px;font-size:15px;font-weight:700;color:var(--ink);text-align:left;
  transition:transform .1s,border-color .1s;
}
.choice:hover{border-color:var(--blue);transform:translateY(-1px);}
.choice.correct{border-color:var(--green);background:#0d3321;animation:pop .35s;}
.choice.wrong{border-color:var(--red);background:#3b1215;animation:shake .35s;}
.choice:disabled{cursor:default;opacity:.85;}
@keyframes pop{50%{transform:scale(1.035)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.numrow{display:flex;gap:10px;margin-top:18px;}
.numinput{
  flex:1;padding:13px 16px;font-size:17px;font-weight:700;border-radius:13px;
  border:2px solid var(--line);background:var(--card2);color:var(--ink);outline:none;min-width:0;
}
.numinput:focus{border-color:var(--purple);}
.feedback{margin-top:14px;border-radius:13px;padding:13px 16px;font-size:14px;line-height:1.55;display:none;}
.feedback.show{display:block;animation:fadeUp .3s;}
.feedback.good{background:#0d3321;border:1px solid #14532d;}
.feedback.bad{background:#3b1215;border:1px solid #7f1d1d;}
.feedback .fb-title{font-weight:700;font-size:15px;margin-bottom:4px;}
.feedback .xpgain{color:var(--gold);font-weight:700;}
.quizfoot{display:flex;justify-content:flex-end;margin-top:14px;gap:10px;}
.feedback.retry{background:#3a2a10;border:1px solid #8a6a1e;}
.retryrow{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.diffchips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0 12px;}
.diffchip{border:2px solid var(--line);background:var(--card2);color:var(--muted);border-radius:99px;
  padding:8px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;}
.diffchip.sel{border-color:var(--gold);color:var(--gold);background:#2a2410;}
.contestbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:13px;padding:12px 16px;color:var(--ink);cursor:pointer;
  font-family:inherit;font-size:14px;margin-bottom:8px;}
.contestbtn:hover{border-color:var(--gold);}
.contestbtn .cname{font-weight:700;flex:1;}
.contestbtn .cbest{font-size:12px;color:var(--gold);font-weight:800;}
.contestbtn .cmeta{font-size:12px;color:var(--muted);}
.testtimer{font-weight:700;font-size:14px;background:var(--card2);border:1px solid var(--line);
  border-radius:99px;padding:5px 13px;color:var(--teal);}
.testtimer.low{color:var(--red);border-color:var(--red);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.revrow{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);
  border-radius:11px;padding:9px 13px;margin-bottom:6px;font-size:13.5px;}
.revrow .rn{font-weight:700;width:34px;color:var(--muted);}
.revrow .rres{font-weight:700;width:24px;text-align:center;}
.mmodal{position:fixed;inset:0;background:rgba(5,8,20,.72);display:flex;align-items:center;
  justify-content:center;z-index:300;animation:fadeUp .18s;}
.mmodal .mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;
  max-width:340px;width:88%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.mmodal h3{font-size:17px;font-weight:700;margin-bottom:8px;}
.mmodal p{font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:16px;}
.mmodal .mrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.codebox{width:100%;min-height:74px;background:var(--card2);border:2px solid var(--line);border-radius:12px;
  color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;padding:10px;
  resize:vertical;box-sizing:border-box;}
.codebox:focus{border-color:var(--purple);outline:none;}
.mycode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;word-break:break-all;
  background:var(--card2);border:1px dashed var(--gold);border-radius:10px;padding:10px 12px;color:var(--gold);}
.lbrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:11px 14px;margin-bottom:7px;}
.lbrow.me{border-color:var(--gold);background:#241d0b;}
.lbrow .lrank{font-size:18px;font-weight:700;width:36px;text-align:center;}
.lbrow .lname{flex:1;font-weight:700;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lbrow .lval{font-weight:700;font-size:17px;color:var(--gold);}
.lbrow .lsub{font-size:11px;color:var(--muted);font-weight:700;}
.lbrow .lx{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:2px 6px;}
.lbrow .lx:hover{color:var(--red);}
.cloudtag{font-size:11.5px;font-weight:800;border-radius:99px;padding:3px 10px;border:1px solid var(--line);}
.cloudtag.on{color:var(--green);border-color:var(--green);}
.cloudtag.off{color:var(--muted);}
.lbinput{width:100%;padding:11px 14px;font-size:14px;font-weight:600;border-radius:11px;border:2px solid var(--line);
  background:var(--card2);color:var(--ink);outline:none;box-sizing:border-box;margin-bottom:8px;}
.lbinput:focus{border-color:var(--purple);}

/* ---------- results ---------- */
.results{text-align:center;padding:30px 18px;}
.results .bigemoji{font-size:60px;animation:pop .5s;}
.results h2{font-size:26px;font-weight:700;margin:10px 0 4px;}
.results .score{font-size:16px;color:var(--muted);}
.results .rewards{display:flex;gap:12px;justify-content:center;margin:20px 0;flex-wrap:wrap;}
.reward{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 20px;}
.reward .rv{font-size:22px;font-weight:700;color:var(--gold);}
.reward .rl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:2px;}

/* ---------- chess board ---------- */
.boardwrap{display:flex;flex-direction:column;align-items:center;margin-top:6px;}
.board{
  display:grid;grid-template-columns:repeat(8,minmax(34px,54px));
  border:4px solid #6b4f2a;border-radius:8px;overflow:hidden;
  box-shadow:0 14px 34px rgba(0,0,0,.5);user-select:none;
}
.sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,5.4vw,38px);cursor:pointer;position:relative;line-height:1;}
.sq.light{background:#f0d9b5;} .sq.dark{background:#b58863;}
.sq.selsq{outline:3px solid var(--gold);outline-offset:-3px;z-index:2;}
.sq.hint::after{content:'';position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(30,120,60,.55);}
.sq.lastmove{box-shadow:inset 0 0 0 3px rgba(255,209,102,.75);}
.sq .pc{filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));}
.sq .pc.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;}
.sq .pc.b{color:#1a1a1a;}
.sq .coord{position:absolute;font-size:9px;font-weight:700;line-height:1;pointer-events:none;opacity:.85;}
.sq .coord.rk{top:2px;left:3px;}
.sq .coord.fl{bottom:2px;right:3px;}
.sq.light .coord{color:#b58863;} .sq.dark .coord{color:#f0d9b5;}
.boardmeta{display:flex;align-items:center;gap:10px;margin:12px 0 4px;flex-wrap:wrap;justify-content:center;}
.turnbadge{font-size:12.5px;font-weight:800;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:5px 13px;}
.puzzlegoal{font-size:14.5px;font-weight:700;text-align:center;margin-bottom:10px;line-height:1.5;}
.puzzlegoal .goal-tag{color:var(--gold);font-weight:700;}

/* ---------- badges ---------- */
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.badge{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px 12px;text-align:center;transition:transform .15s;
}
.badge:hover{transform:translateY(-3px);}
.badge .bico{font-size:36px;}
.badge h5{font-size:13.5px;font-weight:800;margin:8px 0 3px;}
.badge p{font-size:11.5px;color:var(--muted);line-height:1.4;}
.badge.locked{opacity:.38;filter:grayscale(.9);}
.badge.earned{border-color:#54471f;background:#211d12;}
.badge .bdate{font-size:10px;color:var(--gold);font-weight:700;margin-top:5px;}

/* ---------- bottom nav ---------- */
#bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(15,18,38,.92);border-top:1px solid var(--line);backdrop-filter:blur(10px);
}
#bottomnav button{
  background:none;color:var(--muted);font-size:10.5px;font-weight:800;
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 11px;border-radius:12px;
}
#bottomnav button .nico{display:flex;height:20px;}
#bottomnav button.active{color:var(--gold);background:var(--card2);}

/* ---------- character studio ---------- */
.stage{position:relative;height:270px;background:radial-gradient(ellipse 60% 45% at 50% 88%,#232936 0%,var(--card) 70%);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;
  perspective:750px;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;}
.stage:active{cursor:grabbing;}
.spin3d{position:relative;width:168px;height:222px;transform-style:preserve-3d;animation:charbob 3.2s ease-in-out infinite;}
.cface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;justify-content:center;}
.cface.back{transform:rotateY(180deg);}
@keyframes charbob{0%,100%{margin-top:0}50%{margin-top:7px}}
.floorshadow{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:130px;height:18px;border-radius:50%;
  background:rgba(0,0,0,.45);filter:blur(6px);}
.stagename{position:absolute;left:14px;top:10px;font-size:14px;}
.spinbtn{position:absolute;bottom:12px;font-size:16px;padding:6px 12px;}
.spinbtn.left{left:12px;} .spinbtn.right{right:12px;}
.charthumb{display:block;height:71px;overflow:hidden;}
.charthumb svg{display:block;margin:0 auto;}
.shopitem.selchar{outline:2px solid #4a5470;}
.chargrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));}
.av.charhost{background:var(--card2);overflow:hidden;}
.charav svg{display:block;}
.cheerchar{display:flex;justify-content:center;animation:cheer .9s ease;}
@keyframes cheer{0%{transform:translateY(18px) scale(.7);opacity:0}55%{transform:translateY(-8px) scale(1.06)}100%{transform:none;opacity:1}}

/* ---------- avatar frames & shop ---------- */
.av.fr-bronze{border:3px solid #b08d57 !important;}
.av.fr-silver{border:3px solid #a8adb8 !important;}
.av.fr-emerald{border:3px solid #4e9e77 !important;box-shadow:0 0 12px rgba(78,158,119,.5);}
.av.fr-gold{border:3px solid var(--gold) !important;box-shadow:0 0 12px rgba(217,164,65,.55);}
.av.fr-royal{border:3px solid #9299c9 !important;box-shadow:0 0 15px rgba(146,153,201,.65);}
.av.fr-ember{border:3px solid #c98a5e !important;box-shadow:0 0 15px rgba(201,138,94,.7);}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;}
.shopitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 6px 9px;
  display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;font-family:inherit;color:var(--ink);}
.shopitem:hover{border-color:#4a5470;}
.shopitem.equip{border-color:var(--gold);background:#211d12;}
.shopitem .shopemo{font-size:30px;line-height:1;}
.shopitem .shoptag{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.4px;}
.shopitem.equip .shoptag{color:var(--gold);}
.badge .bnext{font-size:9.5px;font-weight:700;letter-spacing:0;text-transform:uppercase;color:var(--gold);margin-top:6px;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;overflow:hidden;}
.rwd{display:inline-flex;align-items:center;gap:2px;font-weight:800;color:var(--gold);}
.rwd svg{flex:none;display:block;}

/* ---------- teacher and assignments ---------- */
.flabel{display:block;font-size:11.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:10px 0 6px;}
.pickrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.pickrow:last-child{border-bottom:none;}
.subcell{width:13px;height:13px;border-radius:3px;display:inline-block;}
.subcell.ok{background:var(--green);}
.subcell.no{background:#4a3034;border:1px solid var(--red);}
.roleseg{display:flex;gap:8px;justify-content:center;margin-bottom:16px;}
.rolebtn{background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:99px;
  padding:9px 20px;font-size:13.5px;font-weight:600;font-family:inherit;}
.rolebtn.sel{border-color:var(--gold);color:var(--gold);background:#26200f;}

/* ---------- info tips ---------- */
.tip{position:relative;display:inline-flex;align-items:center;margin-left:6px;vertical-align:middle;}
.tip .tipdot{width:16px;height:16px;border-radius:50%;border:1.4px solid var(--muted);color:var(--muted);
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:help;
  font-family:var(--display);line-height:1;}
.tip:hover .tipdot,.tip:focus-within .tipdot{border-color:var(--gold);color:var(--gold);}
.tip .tipbox{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  width:min(260px,72vw);background:#262b36;border:1px solid #3a4150;border-radius:9px;
  padding:9px 12px;font-size:12.5px;font-weight:500;line-height:1.55;color:var(--ink);
  box-shadow:0 8px 26px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .15s;z-index:120;
  text-align:left;white-space:normal;}
.tip:hover .tipbox,.tip:focus-within .tipbox{opacity:1;pointer-events:auto;}
.tip.left .tipbox{left:auto;right:-8px;transform:none;}
.num{font-family:var(--display);}
.stattile .sv,.reward .rv,.lbrow .lval,.qcount,.testtimer{font-family:var(--display);}
.tpico{font-family:var(--display);font-weight:700;}

/* ---------- toasts & confetti ---------- */
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{
  background:#262215;border:1px solid #6a5626;
  color:var(--ink);border-radius:10px;padding:11px 20px;font-weight:600;font-size:13.5px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastIn .4s ease,toastOut .4s ease 2.8s forwards;
  display:flex;align-items:center;gap:10px;
}
.toast .tico{font-family:var(--display);font-weight:700;color:var(--gold);font-size:15px;}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-12px)}}
.confetti{position:fixed;top:-12px;z-index:99;pointer-events:none;width:7px;height:11px;border-radius:2px;opacity:.9;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.7;}}

/* problem meta + floating rewards */
.probmeta{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:700;color:var(--muted);padding:2px 6px 8px;flex-wrap:wrap;}
.probmeta b{color:var(--ink);}
.floatxp{
  position:fixed;top:44%;z-index:150;font-size:22px;font-weight:700;pointer-events:none;
  text-shadow:0 2px 8px rgba(0,0,0,.6);animation:floatup 1.4s ease-out forwards;
}
@keyframes floatup{0%{opacity:0;transform:translateY(12px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.1)}30%{transform:scale(1)}100%{opacity:0;transform:translateY(-70px)}}

/* profile stats */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;}
.stattile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;}
.stattile .sv{font-size:23px;font-weight:700;}
.stattile .sl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}
.lessonbox{background:var(--card2);border-left:4px solid var(--purple);border-radius:0 13px 13px 0;padding:13px 16px;font-size:13.5px;line-height:1.6;color:#c7cdf2;margin-bottom:14px;}
.lessonbox b{color:var(--ink);}

/* ---------- image problems (AMC) ---------- */
.imgbox{background:#fff;border-radius:12px;padding:14px 12px;margin-top:10px;}
.imgbox img{width:100%;height:auto;display:block;}
.asyfig{background:#fff;border-radius:10px;padding:10px;margin:10px auto;display:table;max-width:100%;overflow-x:auto;}
.asyfig svg{max-width:min(100%,430px);height:auto;display:block;margin:0 auto;}
.asyfig-zoom{display:block;cursor:zoom-in;padding:12px;}
.asyfig-zoom svg,.asyfig-zoom img{width:100%;height:auto;display:block;margin:0 auto;max-width:none;}
.asyfig-inline{display:table;padding:6px;}
.figzoom{position:fixed;inset:0;z-index:240;background:rgba(8,9,12,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out;padding:18px;animation:chfade .18s ease;}
.figzoombox{background:#fff;border-radius:14px;padding:20px;max-width:94vw;max-height:82vh;overflow:auto;display:flex;align-items:center;justify-content:center;}
.figzoombox svg,.figzoombox img{width:min(88vw,860px);height:auto;max-width:none;}
.figzoomhint{margin-top:12px;font-size:11px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;}
/* ---- v29: phone-size polish ---- */
@media (max-width:480px){
  .qtext{font-size:16px;line-height:1.55;}
  .choice{min-height:48px;font-size:14.5px;}
  .choices.five .choice{padding:14px 4px;font-size:17px;}
  .numinput{font-size:16px;padding:13px 14px;}
  .btn{padding:11px 18px;}
  .btn.small{padding:8px 13px;}
  .todayrow{padding:10px 2px;}
  #bottomnav button{padding:9px 0 7px;}
  .statchips .chip{font-size:11px;padding:4px 8px;}
  .lbinput,.codebox{font-size:16px;}
}
.choices.five{grid-template-columns:repeat(5,1fr);}
.choices.five .choice{text-align:center;font-size:16px;font-weight:700;padding:12px 4px;}
.contest-tag{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.4px;}

/* ---------- board upgrades: bubbles, slide, check ---------- */
.sq.hint::after{content:'';position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(20,90,45,.55);box-shadow:0 0 0 2px rgba(255,255,255,.25) inset;}
.sq.hintcap::after{content:'';position:absolute;inset:6%;border-radius:50%;background:none;border:4px solid rgba(180,40,40,.65);width:auto;height:auto;}
.sq.incheck{box-shadow:inset 0 0 0 4px rgba(220,50,50,.85);animation:checkpulse 1s ease-in-out infinite;}
@keyframes checkpulse{50%{box-shadow:inset 0 0 0 4px rgba(220,50,50,.35)}}
.slideclone{position:fixed;z-index:200;pointer-events:none;display:flex;align-items:center;justify-content:center;transition:transform .26s cubic-bezier(.2,.8,.3,1);line-height:1;}

/* ---------- battle zone ---------- */
.battlegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:640px){.battlegrid{grid-template-columns:1fr;}}
.track.duel{background:var(--card);border-left:3px solid var(--red);}
.track.match{background:var(--card);border-left:3px solid var(--teal);}
.vsbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;}
.vsplayer{flex:1;background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center;min-width:0;}
.vsplayer.active{border-color:var(--gold);box-shadow:0 0 16px rgba(255,209,102,.28);}
.vsplayer .vpn{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vsplayer .vps{font-size:21px;font-weight:700;color:var(--gold);}
.vsmid{font-size:17px;font-weight:700;color:var(--red);flex-shrink:0;}
.timerwrap{height:12px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;position:relative;}
.timerwrap>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--gold),var(--red));transition:width .95s linear;}
.timernum{text-align:center;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;}
.passcard{text-align:center;padding:44px 18px;}
.passcard .bigemoji{font-size:56px;}
.passcard h2{font-size:24px;font-weight:700;margin:12px 0 6px;}
.duelsetup label{display:block;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;}
.duelsetup input[type=text]{width:100%;padding:12px 15px;font-size:15px;font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--card2);color:var(--ink);outline:none;}
.duelsetup input[type=text]:focus{border-color:var(--purple);}
.segrow{display:flex;gap:8px;flex-wrap:wrap;}
.seg{flex:1;background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:10px 8px;font-size:13.5px;font-weight:800;color:var(--muted);min-width:80px;}
.seg.sel{border-color:var(--gold);color:var(--ink);background:#3a3512;}

/* ---------- chess match ---------- */
.capbar{display:flex;align-items:center;gap:2px;min-height:26px;font-size:19px;flex-wrap:wrap;padding:2px 6px;}
.capbar .cw{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000;} .capbar .cb{color:#14141c;text-shadow:0 0 2px #888;}
.matchhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.movelog{max-height:76px;overflow-y:auto;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.7;margin-top:12px;width:100%;}

/* ---------- tiered badges ---------- */
.badge .tierrow{display:flex;gap:5px;justify-content:center;margin-top:8px;}
.badge .tierdot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;background:var(--bg);border:1.5px solid var(--line);color:var(--muted);font-weight:700;}
.badge .tierdot.t1{background:#5a3a1e;border-color:#a05a2c;color:#f0b27a;}
.badge .tierdot.t2{background:#4a4a52;border-color:#9aa0aa;color:#e8eaf0;}
.badge .tierdot.t3{background:#4a3a08;border-color:var(--gold);color:var(--gold);}
.badge .tierdot.t4{background:#233a4a;border-color:#8fd8ff;color:#c9ecff;}
.badge .tierdot.t5{background:#0d3a3a;border-color:var(--teal);color:#8ffff2;box-shadow:0 0 8px rgba(45,212,191,.5);}
.badge .bprog{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:6px;}
.badge .bprogbar{height:5px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:4px;}
.badge .bprogbar>div{height:100%;background:var(--gold);border-radius:99px;}
/* ---- v20: Today card, chest, seasons, challenges ---- */
.todaycard{padding:13px 18px 11px;}
.todayhead{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.todaystreak{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--orange);}
.todaystreak .tdfrz{color:#8fc7e8;font-weight:700;}
.todayrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid rgba(255,255,255,.05);font-size:13.5px;font-weight:600;}
.todayrow.done{color:var(--muted);}
.todayrow.done span{text-decoration:none;}
.tdchk{width:20px;height:20px;border-radius:7px;border:1.5px solid #3d4356;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--green);flex:none;}
.todayrow.done .tdchk{background:rgba(94,182,125,.14);border-color:var(--green);}
.tdgo{font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;}
.chestrow{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px dashed #3d4356;font-size:12.5px;color:var(--muted);}
.chestrow.ready{border:1.5px solid var(--gold);color:var(--ink);background:rgba(217,164,65,.08);animation:chestglow 1.6s ease-in-out infinite alternate;}
.chestrow.opened{border-style:solid;opacity:.75;}
.chesticon{font-size:19px;flex:none;}
@keyframes chestglow{from{box-shadow:0 0 0 rgba(217,164,65,0);}to{box-shadow:0 0 14px rgba(217,164,65,.35);}}
.todayseason{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.05);font-size:12.5px;font-weight:700;color:var(--muted);}
.todayasglink{display:flex;align-items:center;gap:6px;margin-top:7px;padding-top:8px;border-top:1px solid rgba(255,255,255,.05);font-size:12.5px;font-weight:700;cursor:pointer;}
.todayasglink:hover{color:var(--gold);}
.repaircard{display:flex;align-items:center;gap:10px;padding:12px 18px;border-color:var(--gold);flex-wrap:wrap;}
.tmrwline{margin:10px auto 2px;font-size:12.5px;color:var(--muted);max-width:420px;}
.pbbanner{display:inline-block;margin:6px auto 2px;padding:6px 14px;border-radius:99px;background:rgba(217,164,65,.14);border:1px solid var(--gold);color:var(--gold);font-size:13px;font-weight:800;}
.chalcompare{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0 6px;}
.chalside{background:var(--bg);border:1px solid #3d4356;border-radius:14px;padding:12px 20px;min-width:104px;}
.chalside.me{border-color:var(--gold);}
.chalside .cname{font-size:12px;font-weight:700;color:var(--muted);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chalside .cscore{font-size:30px;font-weight:800;color:var(--ink);}
.chalvs{font-size:13px;font-weight:900;color:var(--muted);letter-spacing:1px;}
.dealbanner{display:flex;align-items:center;gap:10px;margin:2px 0 10px;padding:10px 14px;border-radius:12px;border:1px solid var(--gold);background:rgba(217,164,65,.07);font-size:12.5px;}
/* ---- v21: chest opening ceremony ---- */
.chestov{position:fixed;inset:0;background:rgba(10,11,15,.84);z-index:220;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:chfade .25s ease;}
@keyframes chfade{from{opacity:0;}to{opacity:1;}}
.chestwrap{position:relative;text-align:center;padding:30px 40px;}
.chestsvg{position:relative;z-index:2;animation:chestshake .32s ease-in-out 3;}
.chestov.open .chestsvg{animation:none;}
@keyframes chestshake{0%,100%{transform:rotate(0);}25%{transform:rotate(-7deg);}75%{transform:rotate(7deg);}}
.clid{transform-origin:18px 46px;transition:transform .5s cubic-bezier(.34,1.56,.64,1);}
.chestov.open .clid{transform:rotate(-74deg);}
.chrays{position:absolute;left:50%;top:38%;width:320px;height:320px;transform:translate(-50%,-50%) scale(0);border-radius:50%;background:radial-gradient(circle,rgba(217,164,65,.45),rgba(217,164,65,0) 65%);transition:transform .6s ease;z-index:1;pointer-events:none;}
.chestov.open .chrays{transform:translate(-50%,-50%) scale(1);}
.chcoin{position:absolute;left:50%;top:40%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f5e0a8,#d9a441 60%,#a87a24);border:1.5px solid #8a6218;opacity:0;z-index:3;pointer-events:none;}
.chestov.open .chcoin{animation:coinfly 1.05s ease-out forwards;}
@keyframes coinfly{0%{opacity:0;transform:translate(0,0) scale(.4);}15%{opacity:1;}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(1);}}
.chamount{margin-top:8px;font-size:27px;font-weight:800;color:var(--gold);opacity:0;transform:translateY(8px);transition:all .4s ease .25s;}
.chamount .num{font-size:inherit;}
.chestov.open .chamount{opacity:1;transform:none;}
.chjack{font-size:15px;font-weight:900;letter-spacing:2.5px;color:var(--orange);animation:chestshake .4s ease-in-out infinite;}
.chtitle{margin-top:3px;font-size:13.5px;font-weight:800;color:var(--ink);letter-spacing:.4px;}
.chsub{font-size:11.5px;color:var(--muted);max-width:270px;margin:3px auto 0;}
.chtap{margin-top:15px;font-size:10.5px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;opacity:0;transition:opacity .4s ease .9s;}
.chestov.open .chtap{opacity:1;}
/* ---- v22: answer outcome pie ---- */
.accpie{display:flex;align-items:center;gap:18px;padding:15px 18px;flex-wrap:wrap;}
.piewrap{flex:none;display:flex;align-items:center;justify-content:center;}
.pierow{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-top:7px;}
.pierow b{min-width:44px;text-align:right;}
.piedot{width:10px;height:10px;border-radius:4px;flex:none;}
/* ---- v23: mystery loot, power-ups, hints ---- */
.chline{display:flex;align-items:center;justify-content:center;gap:8px;font-size:21px;font-weight:800;color:var(--gold);}
.chline+ .chline{margin-top:2px;}
.chsub2{font-size:11.5px;color:var(--muted);margin:2px auto 4px;max-width:250px;}
.hintrow{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:12px;}
.hintrow .btn{font-size:12px;color:var(--teal);border-color:#2a4a48;}
.choice.xout{opacity:.28;text-decoration:line-through;pointer-events:none;}
.sollink{color:var(--gold);font-weight:700;text-decoration:underline;text-underline-offset:2px;}
.sollink:hover{color:#f5e0a8;}
/* ---- v26: teacher power pack ---- */
.annbanner{display:flex;gap:9px;align-items:center;padding:11px 16px;border-color:var(--gold);margin-bottom:12px;font-size:13px;}
table.rpt{width:100%;border-collapse:collapse;margin-top:8px;}
.rpt th,.rpt td{border:1px solid #3d4356;padding:5px 9px;font-size:12px;text-align:left;}
.rpt th{color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;font-size:10.5px;}
@media print{
  #topbar,#bottomnav,.noprint{display:none!important;}
  body,html{background:#fff!important;}
  #screen-root,.rptcard,.rptcard h2,.rptcard b{color:#000!important;}
  .card,.rptcard{background:#fff!important;border-color:#999!important;box-shadow:none!important;}
  .rptcard .sub{color:#444!important;}
  .rpt th,.rpt td{border-color:#999!important;color:#000!important;}
}
/* ---- v27: accounts and login ---- */
.logingrid{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
.logincard{position:relative;background:var(--card);border:1px solid #2c3040;border-radius:16px;padding:16px 18px 13px;min-width:128px;cursor:pointer;color:var(--ink);font-family:inherit;transition:border-color .15s,transform .15s;}
.logincard:hover{border-color:var(--gold);transform:translateY(-2px);}
.loginav{display:block;font-size:34px;margin-bottom:6px;}
.loginname{display:block;font-weight:800;font-size:14.5px;}
.loginrole{display:block;font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-top:3px;}
.logindel{position:absolute;top:4px;right:4px;background:none;border:none;color:var(--muted);font-size:14px;padding:4px 8px;min-width:28px;min-height:28px;border-radius:8px;cursor:pointer;}
.logindel:hover{color:var(--red);background:var(--card2);}
.loginpw{max-width:360px;margin:16px auto 0;padding:14px 18px;text-align:left;}
.pwrow{display:flex;gap:6px;align-items:center;margin-top:8px;}
.pweye{padding:8px 10px;font-size:14px;flex:none;}
.stayrow{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--muted);margin:10px 0;cursor:pointer;}
.pwsetup{max-width:340px;margin:12px auto 16px;text-align:left;}
.pwmeter{height:5px;background:var(--bg);border-radius:99px;margin-top:7px;overflow:hidden;}
.pwmeter>div{height:100%;width:0;border-radius:99px;transition:width .2s;}
.pwlabel{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-top:3px;min-height:13px;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar" class="hidden" role="banner">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" width="24" height="24"><rect x="1.5" y="1.5" width="21" height="21" rx="5.5" fill="none" stroke="var(--gold)" stroke-width="1.8"/><path d="M6.5 17V8l5.5 6 5.5-6v9" fill="none" stroke="var(--gold)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>MindMasters</span></div>
    <div class="statchips">
      <div class="chip lvl" data-tip="Your level. Every solved problem earns XP, and enough XP reaches the next level and a new title."><span id="chipLevel">Lv 1</span></div>
      <div class="chip xp" data-tip="All the XP you have ever earned. Harder problems and combos pay more."><span id="chipXP">0 XP</span></div>
      <div class="chip streak" data-tip="Days in a row with at least one solve. Miss a day and it resets, unless a freeze saves it."><span id="chipStreak">0</span></div>
      <div class="chip coins" data-tip="Coins come from solving and from chests. Spend them in the Avatar Studio or on a streak freeze."><span id="chipCoins">0 coins</span></div>
    </div>
  </div>
  <div id="screen-root" role="main" tabindex="-1"></div>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="bottomnav" class="hidden" role="navigation" aria-label="Main sections">
  <button data-nav="home" data-tip="Today's checklist, your arenas and your trophy case"><span class="nico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg></span>Home</button>
  <button data-nav="math" data-tip="Practice by contest or by topic"><span class="nico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5h14M12 5 6.5 19M12 5l5.5 14"/><path d="M8.2 14.5h7.6"/></svg></span>Math</button>
  <button data-nav="chess" data-tip="Puzzles, drills and full games"><span class="nico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20h8M9 17.5h6M14.5 17.5c1.2-2.4 2-4.6 2-7A6 6 0 0 0 8 8.6c0 1 .5 1.9 1.4 2.4l-1.6 3.3c-.4.9.2 1.7 1.2 1.7"/><circle cx="10.5" cy="7" r=".6" fill="currentColor"/></svg></span>Chess</button>
  <button data-nav="battle" data-tip="Duel a friend at math or play chess head to head"><span class="nico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 12.5 12.5M20 4 7.5 16.5"/><path d="M4 20l3.5-3.5M20 20l-3.5-3.5"/><path d="M5.5 14.5 4 20l5.5-1.5M18.5 14.5 20 20l-5.5-1.5"/></svg></span>Battle</button>
  <button data-nav="badges" data-tip="Everything you have earned so far"><span class="nico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5.5"/><path d="m9 13.5-2 7 5-2.5 5 2.5-2-7"/></svg></span>Badges</button>
  <button data-nav="profile" data-tip="Your stats, rating chart, settings and backups"><span class="nico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.3-3.4 4.1-5 7.5-5s6.2 1.6 7.5 5"/></svg></span>Profile</button>
</div>
<script>
